{% extends "base.html" %} {% block content %}
<section class="grid gap-5">
  <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
    <div>
      <h1 class="max-w-3xl text-4xl font-semibold tracking-tight md:text-6xl">
        Make a video!
      </h1>
    </div>
  </div>

  <form
    action="{{ url_for('main.create_job_view') }}"
    method="post"
    class="rounded-lg border border-neutral-200 bg-white p-4 shadow-sm"
  >
    <div class="grid gap-4 lg:grid-cols-[1fr_1fr_180px]">
      <label class="block">
        <span class="mb-2 block text-sm font-medium">Topic</span>
        <textarea
          name="concept"
          rows="4"
          class="field"
          placeholder="Bayes theorem for interpreting genetics data"
          required
        ></textarea>
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-medium">Context</span>
        <textarea
          name="research"
          rows="4"
          class="field"
          placeholder="Optional: class level, field, data, misconception, or example"
        ></textarea>
      </label>
      <label class="block">
        <span class="mb-2 block text-sm font-medium">Length</span>
        <select name="duration_label" class="field">
          <option value="short">Short (~1 min)</option>
          <option value="medium" selected>Medium (~3 min)</option>
          <option value="long">Long (~5 min)</option>
        </select>
      </label>
    </div>
    <div class="mt-4 flex justify-end border-t border-neutral-200 pt-4">
      <button class="btn-primary">Generate video</button>
    </div>
  </form>
</section>

<section class="space-y-3">
  <div
    class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between"
  >
    <h2 class="text-xl font-semibold tracking-tight">Recent videos</h2>
  </div>

  <div class="grid gap-3">
    {% for job in jobs %}
    <a
      href="{{ url_for('main.video_page', job_id=job.id) }}"
      class="library-row"
    >
      <div class="min-w-0">
        <h3 class="truncate font-medium">{{ job.title or job.concept }}</h3>
        <p class="mt-1 truncate text-sm text-neutral-500">
          {{ job.progress_detail }}
        </p>
      </div>
      <span class="status-badge status-{{ job.status }}">{{ job.status }}</span>
      <div>
        <div class="h-1.5 overflow-hidden rounded-full bg-neutral-200">
          <div
            class="h-full rounded-full bg-neutral-950 {% if job.is_active %}lern-loading-bar{% endif %}"
            style="width: {{ job.progress_percent }}%"
          ></div>
        </div>
        <p class="mt-1 text-xs text-neutral-500">{{ job.progress_percent }}%</p>
      </div>
    </a>
    {% else %}
    <div
      class="rounded-lg border border-dashed border-neutral-300 bg-white p-8 text-sm text-neutral-500"
    >
      No videos generated yet.
    </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
