{% extends "base.html" %} {% block site_header %}{% endblock %} {% block content %}
<section class="grid min-h-[calc(100vh-3rem)] place-items-center">
  <div class="max-w-md text-center">
    <div
      class="results-celebration mx-auto mb-5 grid h-14 w-14 place-items-center rounded-full bg-emerald-100 text-emerald-700"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-7 w-7"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5 13l4 4L19 7"
        />
      </svg>
    </div>
    <p class="eyebrow justify-center">Complete</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight">
      Thanks for using lern.
    </h1>
    <p class="mt-2 text-sm leading-6 text-neutral-500">
      Your quiz results and feedback were saved. You can generate another lesson anytime.
    </p>
    <div class="mt-6 flex flex-wrap justify-center gap-3">
      <a href="{{ url_for('main.home') }}" class="btn-primary">Return home</a>
    </div>
  </div>
</section>
{% endblock %}
