<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lern</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.svg') }}"
      type="image/svg+xml"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    {% block head_extra %}{% endblock %}
  </head>
  <body class="min-h-screen bg-[#f7f8fb] text-neutral-950 antialiased">
    <div class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
      {% block site_header %}
      <header
        class="mb-8 flex items-center justify-between border-b border-neutral-200/80 pb-4"
      >
        <a
          href="{{ url_for('main.home') }}"
          class="text-xl font-semibold tracking-tight"
          >lern</a
        >
        <nav class="flex items-center gap-2 text-sm">
          <a
            href="{{ url_for('main.hello') }}"
            class="rounded-md px-3 py-1.5 text-neutral-500 transition hover:bg-neutral-100 hover:text-neutral-950"
            >Instructions</a
          >
        </nav>
      </header>
      {% endblock %} {% with messages = get_flashed_messages() %} {% if messages
      %}
      <section class="mb-4 space-y-2">
        {% for message in messages %}
        <div
          class="rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 text-sm text-amber-900"
        >
          {{ message }}
        </div>
        {% endfor %}
      </section>
      {% endif %} {% endwith %}
      <main class="space-y-6">{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
