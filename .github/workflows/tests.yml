name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app.py app
      - run: python -m unittest discover -s tests -v
